<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#102823">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
  <link rel="stylesheet" href="editor-v2.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Editor | Excepcional Build</title>
</head>
<body data-portal-page="editor-v2">
  <main class="editor-shell">
    <header class="editor-topbar">
      <div class="editor-topbar-main">
        <a class="editor-back-link" id="editor-v2-back" href="panel.html">← Volver al proyecto</a>
        <div>
          <p class="editor-eyebrow">Editor autogestionable</p>
          <h1 id="editor-v2-project-name">Editor de tu sitio</h1>
          <p id="editor-v2-project-copy">Edita por páginas, revisa en vista previa y publica cuando estés listo.</p>
        </div>
      </div>

      <div class="editor-topbar-actions">
        <span class="editor-mode-badge" id="editor-v2-mode-badge">Modo edición</span>
        <button class="button button-light" id="editor-v2-save" type="button">Guardar borrador</button>
        <button class="button button-light" id="editor-v2-reset" type="button">Restablecer</button>
        <button class="button button-light" id="editor-v2-preview" type="button">Vista previa</button>
        <button class="button button-primary" id="editor-v2-publish" type="button">Publicar cambios</button>
      </div>
    </header>

    <section class="editor-page-tabs" id="editor-v2-page-tabs"></section>

    <section class="editor-layout">
      <aside class="editor-sidebar" id="editor-v2-sidebar">
        <div class="editor-sidebar-empty" id="editor-v2-sidebar-empty">
          <strong>Selecciona una sección</strong>
          <p>Toca un bloque de la página para editar su contenido.</p>
        </div>

        <form class="editor-form" id="editor-v2-form" hidden>
          <div class="editor-form-head">
            <div>
              <p class="editor-eyebrow">Bloque activo</p>
              <h2 id="editor-v2-section-title">Sección</h2>
            </div>
            <label class="editor-visibility-toggle">
              <input type="checkbox" id="editor-v2-section-visible">
              <span>Visible</span>
            </label>
          </div>

          <div class="editor-form-fields" id="editor-v2-fields"></div>
        </form>
      </aside>

      <section class="editor-canvas-wrap">
        <div class="editor-canvas-toolbar">
          <strong id="editor-v2-current-page">Página</strong>
          <span id="editor-v2-current-state">Edita esta página bloque por bloque.</span>
        </div>

        <nav class="editor-preview-nav" id="editor-v2-preview-nav" hidden></nav>

        <div class="editor-canvas is-edit" id="editor-v2-canvas"></div>
      </section>
    </section>

    <p class="form-status" id="editor-v2-status"></p>
  </main>

  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="editor-v2.js"></script>
</body>
</html>
