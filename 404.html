<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órbita desbocada - 404 | Excepcional Build</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040613;
      --ink: #ffffff;
      --muted: #8fa09b;
      --orange: #f36b3f;
      --lime: #d8eb82;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    /* Estrellas sutiles */
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.6;
    }
    .star-1 { top: 15%; left: 10%; width: 2px; height: 2px; }
    .star-2 { top: 40%; right: 15%; width: 3px; height: 3px; opacity: 0.8; }
    .star-3 { bottom: 20%; left: 20%; width: 1.5px; height: 1.5px; }
    .star-4 { bottom: 35%; right: 25%; width: 2px; height: 2px; }
    
    .container {
      max-width: 600px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* El Planeta y su Órbita 3D */
    .space-scene {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 24px;
      display: grid;
      place-items: center;
    }
    .planet {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e463c, #3a6055, #d8eb82);
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 30px rgba(216, 235, 130, 0.25);
      position: relative;
      z-index: 2;
    }
    .planet::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0%, transparent 60%);
    }
    /* Órbita estilo SpaceX */
    .orbit {
      position: absolute;
      width: 190px;
      height: 70px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      transform: rotate(-25deg);
      display: grid;
      place-items: center;
      animation: orbit-spin 12s linear infinite;
    }
    .orbit-inner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(243, 107, 63, 0.4);
      border-radius: 50%;
    }
    .satellite {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 20px var(--orange);
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
    }
    h1 {
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: clamp(80px, 15vw, 110px);
      line-height: 0.9;
      margin: 0;
      letter-spacing: -0.05em;
      background: linear-gradient(to bottom, #ffffff 40%, var(--lime) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-family: "Manrope", sans-serif;
      font-weight: 700;
      font-size: 24px;
      margin: 16px 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 480px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .button:hover {
      transform: translateY(-2px);
    }
    .button-primary {
      background: var(--lime);
      color: #040613;
      box-shadow: 0 10px 25px rgba(216, 235, 130, 0.2);
    }
    .button-primary:hover {
      background: #cce072;
    }
    .button-outline {
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .button-outline:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    @keyframes orbit-spin {
      from { transform: rotate(-25deg); }
      to { transform: rotate(335deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit { animation: none; }
    }
  </style>
</head>
<body>
  <div class="star star-1"></div>
  <div class="star star-2"></div>
  <div class="star star-3"></div>
  <div class="star star-4"></div>

  <div class="container">
    <div class="space-scene">
      <div class="planet"></div>
      <div class="orbit">
        <div class="orbit-inner"></div>
        <div class="satellite"></div>
      </div>
    </div>
    <h1>404</h1>
    <h2>Órbita desbocada</h2>
    <p>El enlace que buscas no existe en esta galaxia digital. Parece que tu trayectoria se desvió un poco del rumbo.</p>
    
    <div class="actions">
      <a href="index.html" class="button button-primary">Regresar al Inicio</a>
      <a href="cotizar.html" class="button button-outline">Cotizar Sitio Web</a>
    </div>
  </div>
</body>
</html>
