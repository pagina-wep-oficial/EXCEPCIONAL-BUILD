<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente para el espacio profundo de fondo -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#030511"/>
    </radialGradient>
    
    <!-- Gradiente del planeta con colores de la marca (Bosque profundo a Lima brillante) -->
    <linearGradient id="planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e463c"/>
      <stop offset="50%" stop-color="#3a6055"/>
      <stop offset="100%" stop-color="#d8eb82"/>
    </linearGradient>
    
    <!-- Gradiente del anillo orbital (blanco brillante a naranja neón de la marca) -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f36b3f"/>
      <stop offset="100%" stop-color="#d84c25" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Brillo del núcleo del planeta -->
    <radialGradient id="glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#d8eb82" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo espacial circular con bordes suaves -->
  <circle cx="64" cy="64" r="60" fill="url(#space-bg)" stroke="#1a2542" stroke-width="1.5"/>

  <!-- Estrellas de fondo sutiles -->
  <circle cx="34" cy="36" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="94" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="88" r="0.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="88" cy="94" r="1.2" fill="#ffffff" opacity="0.7"/>

  <!-- Parte trasera de la órbita (detrás del planeta) -->
  <path d="M -10,75 C 20,40 100,20 135,35" fill="none" stroke="url(#orbit-grad)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- El Planeta Central (Excepcional) -->
  <circle cx="64" cy="64" r="32" fill="url(#planet-grad)"/>
  <circle cx="64" cy="64" r="32" fill="url(#glow)"/>

  <!-- Sombra del planeta para dar profundidad 3D -->
  <path d="M 64,32 A 32,32 0 0,1 96,64 A 32,32 0 0,1 64,96 A 32,32 0 0,1 64,32 Z" fill="#030511" opacity="0.45"/>

  <!-- Parte delantera de la órbita (pasa por enfrente con efecto SpaceX) -->
  <!-- Una trayectoria elíptica ultra-dinámica, como un lanzamiento -->
  <path d="M 10,95 C 25,82 60,60 110,40" fill="none" stroke="url(#orbit-grad)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Trazo brillante blanco central de la órbita para simular velocidad -->
  <path d="M 15,91 C 30,80 62,60 102,43" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

  <!-- Pequeño punto brillante/destello que simula un satélite/cohete en la órbita -->
  <circle cx="106" cy="41" r="3" fill="#ffffff"/>
  <circle cx="106" cy="41" r="6" fill="#f36b3f" opacity="0.5"/>
</svg>